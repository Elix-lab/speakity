<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speakly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --display:"Baloo 2","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Nunito",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --outer:#FFC93C;
  --ink:#17191B; --muted:#66705F; --surface:#FFFFFF; --bg:#FFF7DF;

  /* Sticker journal palette — four roles + one secondary, on warm paper */
  --leaf:#3FD12B;  --leaf-d:#17191B; --leaf-t:#DFF6D0; --leaf-x:#17191B;   /* Hero green — the one primary action */
  --shell:#F3E8C9; --shell-d:#17191B;--shell-t:#F3E8C9;--shell-x:#17191B; /* neutral warm tag */
  --sun:#FFC400;   --sun-d:#17191B;  --sun-t:#FFF0C2;  --sun-x:#17191B;   /* Warm yellow — streak, achievements, "nice!" */
  --coral:#FF4458; --coral-d:#17191B;--coral-t:#FFE0E4;--coral-x:#17191B;/* Red — grammar / needs work */
  --sea:#1E9BEB;   --sea-d:#17191B;  --sea-t:#DCEEFB;  --sea-x:#17191B;  /* Sky blue — "more natural" + info */
  --sea-soft:#1E9BEB; --sea-soft-t:#DCEEFB;
  --ok:#10B374;    --ok-d:#17191B;   --ok-t:#D3F3E5;   --ok-x:#17191B;   /* Emerald — mastered / progress */
  --new:#DED0A3;   --new-d:#17191B;  --new-t:#F3E8C9;  --new-x:#17191B; /* Warm stone — "new", no hue needed */

  --line:#17191B; --edge:#17191B;
  --p-home:#FFF7DF; --p-talk:#17191B; --p-summary:#FFF7DF; --p-practice:#FFF7DF; --p-done:#FFF7DF;
  --on-dark:#FFF7DF;

  /* sticker shadow sizes, reused everywhere so the whole UI reads as the
     same material as the mascot's die-cut sticker artwork */
  --pop:4px; --pop-lg:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--outer);color:var(--ink);font-family:var(--body);font-weight:500;display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit}
img{display:block;-webkit-user-drag:none;user-select:none}
:focus-visible{outline:3px solid var(--sea);outline-offset:3px}

/* Sticker mascot: white die-cut edge + black outline */
img[alt]:not(.mark img){filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(2px 0 0 #17191B) drop-shadow(-2px 0 0 #17191B) drop-shadow(0 2px 0 #17191B) drop-shadow(0 -2px 0 #17191B)}

/* Phone frame */
#phone{position:relative;width:390px;height:min(844px,calc(100% - 52px));background:var(--bg);border-radius:40px;overflow:hidden;outline:5px solid var(--ink);outline-offset:0;border:0}
@media (max-width:600px),(pointer:coarse){body{display:block}#phone{width:100%;max-width:none;height:100%;border-radius:0;outline:0}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background-color:var(--page,var(--bg))}
.p-home{--page:var(--p-home)} .p-talk{--page:var(--p-home)} .p-summary{--page:var(--p-summary)}
.p-practice,.p-cards{--page:var(--p-practice)} .p-done{--page:var(--p-done)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 20px 20px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 8px;gap:12px;min-height:68px}
.enter{animation:enter .35s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Type */
h1{font-family:var(--display);font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.01em;margin:8px 0 6px}
h2{font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0}
p{margin:0}
.sub{color:var(--muted);font-weight:600;font-size:16px;line-height:1.4}
.small{font-size:13px;font-weight:600;color:var(--muted)}
.grow{flex:1;min-width:0}

/* Sticker surfaces: a real ink border + a solid offset shadow, same
   material language as the mascot artwork, on every card in the app */
.card,.review-card,.insight,.convo,.stat,.due-card,.bubble{background:var(--surface);border:2px solid var(--ink);border-radius:22px;box-shadow:var(--pop) var(--pop) 0 var(--ink)}
.due-card,.review-card,.stat,.win-hero{transform:rotate(-.6deg)}
.practice-card{transform:rotate(.5deg)}
/* a little pin, like these cards are tacked to the page by hand */
.win-hero,.practice-card{position:relative}
.win-hero::before,.practice-card::before{
  content:"";position:absolute;top:-9px;left:28px;width:16px;height:16px;border-radius:50%;
  background:var(--sun);border:2px solid var(--ink);box-shadow:1px 1px 0 var(--ink);z-index:2;
}

/* Logo, marks, pills */
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.02em}
.logo b{color:var(--coral);font-weight:700;margin-left:-6px}
.mark{display:grid;place-items:center;width:var(--s,36px);height:var(--s,36px);border-radius:14px;background:var(--leaf);overflow:hidden;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.mark img{width:122%;height:122%;max-width:none;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-family:var(--display);font-weight:600;font-size:16px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.streak{background:var(--sun);color:var(--ink)}
.streak.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--shell-t);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;border:2px solid var(--ink)}
.right{display:flex;align-items:center;gap:8px}

/* Buttons: every button is a sticker — the primary action just gets the
   bigger shadow and the hero color, so it still leads the eye */
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;
  border:2px solid var(--ink);border-radius:18px;padding:0 22px;
  font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.005em;color:var(--ink);background:var(--c);
  cursor:pointer;transition:transform .08s,box-shadow .08s;
  box-shadow:var(--pop) var(--pop) 0 var(--ink);
}
.btn:active{transform:translate(var(--pop),var(--pop));box-shadow:none}
.btn.talk,.btn.sea{box-shadow:var(--pop-lg) var(--pop-lg) 0 var(--ink)}
.btn.talk:active,.btn.sea:active{transform:translate(var(--pop-lg),var(--pop-lg));box-shadow:none}
.btn.talk{--c:var(--leaf)} .btn.sea{--c:var(--leaf)} .btn.shell{--c:var(--sun)} .btn.red{--c:var(--coral)}
.btn.ghost{--c:var(--surface)}
.btn.big{height:60px;font-size:19px}
.btn:disabled{--c:#E7EEE9;color:#8FA095;border-color:#8FA095;cursor:not-allowed;transform:none;box-shadow:none}
.limit-note{text-align:center;margin-top:12px}
.mid-cta{margin:20px 0 0}
.pr-scroll .mid-cta{margin-top:0}
.mid-cta+.sec-row{margin-top:26px}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .08s,box-shadow .08s;box-shadow:2px 2px 0 var(--ink)}
.round:active{transform:translate(2px,2px);box-shadow:none}
.round.on{background:var(--coral)}

/* Mascot animations */
.monty{transform-origin:50% 100%}
@keyframes idle{0%,100%{transform:rotate(-2deg) translateY(0)}50%{transform:rotate(2deg) translateY(-4px)}}
@keyframes chat{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-12px) scale(.98,1.03)}60%{transform:translateY(0) scale(1.04,.96)}}
@keyframes lean{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(3deg)}}

/* Speech bubble */
.bubble{position:relative;padding:12px 16px;font-weight:700;font-size:16px;line-height:1.35;font-family:var(--hand);font-size:19px}

/* HOME */
.hello{display:flex;align-items:center;gap:12px;padding:20px 20px 10px}
.hello .mark{--s:54px;flex:none}
.hello h1{font-size:28px;margin:0;line-height:1}
.hello .sub{font-size:14px;margin-top:3px}
.hello .right{margin-left:auto}
.sec{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:24px 0 12px}
.card{padding:20px}
.week-head{display:flex;justify-content:space-between;align-items:baseline}
.week-head b{font-family:var(--display);font-size:18px;font-weight:700}
.week-head span{font-weight:700;font-size:14px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.day i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.day.done i{background:var(--ok);color:#fff}
.day.today{color:var(--ink);font-weight:800}
.day.today i{background:var(--sun)}
.today-top{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:84px;height:84px;flex:none}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--ink)}
.ring-num b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;color:var(--ink)}
.ring-num small{font-size:12px;font-weight:700;color:var(--muted)}
.today-t{font-family:var(--display);font-size:18px;font-weight:700;display:block}
.today-n{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.list{padding:0;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;border-radius:0}
.row+.row{border-top:2px solid var(--ink)}
.row:active{background:var(--sun-t)}
.row b{display:block;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.005em}
.chips-sm{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips-sm .chip{padding:2px 8px;font-size:12px}
.review-card{margin-top:16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;cursor:pointer}
.badge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--sea);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:20px;border:2px solid var(--ink)}
.badge.done{background:var(--ok);color:#fff}
.review-card b{display:block;font-family:var(--display);font-size:17px;font-weight:700}
.review-card span.s{font-size:13px;font-weight:600;color:var(--muted)}

/* Tabs */
#tabs{display:none;position:absolute;left:0;right:0;bottom:0;z-index:20;padding:6px 14px 12px;background:var(--surface);border-top:2px solid var(--ink)}
.tabs-track{position:relative;display:grid;grid-template-columns:1fr 1fr}
.tab{position:relative;z-index:1;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border-radius:14px;font-family:var(--display);font-weight:700;font-size:14px;color:#A39B85;transition:color .2s,transform .1s}
.tab.active{color:var(--ink);font-weight:700}
.tab:active{transform:scale(.94)}
.tab .ico{position:relative;display:grid;place-items:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tab.active .ico{transform:scale(1.1)}
.tab .dot{position:absolute;top:-6px;right:-13px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--coral);color:#fff;font-family:var(--body);font-size:12px;font-weight:700;display:grid;place-items:center;border:1.5px solid var(--surface)}
.tab .dot:empty{display:none}
#phone.with-tabs .screen{bottom:76px}

/* TALK — same paper page as the rest of the app. State is told through
   which animation the mascot plays, not through color or background. */
.timer{font-family:var(--display);font-weight:600;font-size:17px;background:#fff;border:2px solid var(--ink);padding:5px 14px;border-radius:99px;font-variant-numeric:tabular-nums;box-shadow:2px 2px 0 var(--ink)}

/* Focus view: one big mascot, centered */
.focus-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 20px}
.monty-big{width:230px}
#talk[data-mode="muted"] .monty-big{opacity:.55}

.status{text-align:center;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.005em}
.waves{display:flex;align-items:center;justify-content:center;gap:4px;height:40px}
.bar{width:5px;height:7px;border-radius:3px;background:var(--ink);opacity:.35;border:0}
#talk[data-mode="speaking"] .bar,#talk[data-mode="listening"] .bar{opacity:.8;animation:bar var(--d,.9s) ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes bar{0%,100%{height:7px}50%{height:var(--h,34px)}}
/* Thinking: swap the waveform for three slow dots — there's no live audio
   to visualize while we wait on the network round trip. */
.waves{display:flex}
#talk[data-mode="thinking"] .waves{display:none}
.think-dots{display:none;align-items:center;justify-content:center;gap:7px;height:40px}
#talk[data-mode="thinking"] .think-dots{display:flex}
.think-dots i{width:8px;height:8px;border-radius:50%;background:var(--ink);opacity:.3;animation:thinkDot 1.3s ease-in-out infinite}
.think-dots i:nth-child(2){animation-delay:.18s}
.think-dots i:nth-child(3){animation-delay:.36s}
@keyframes thinkDot{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-5px)}}
/* Tap-to-end-turn mic — only shown while it's your turn to talk. Tapping it
   ends your turn right away instead of waiting out the scripted timer. */
.mic-btn{display:flex;margin-top:18px;width:64px;height:64px;border-radius:50%;border:2px solid var(--ink);background:var(--coral);color:#fff;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--pop-lg) var(--pop-lg) 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s}
.mic-btn:active{transform:translate(4px,4px);box-shadow:none}
#talk[data-mode="speaking"] .mic-btn,#talk[data-mode="thinking"] .mic-btn,#talk[data-mode="muted"] .mic-btn{background:#D7CDA6;opacity:.5;cursor:not-allowed;box-shadow:none;pointer-events:none}

/* Chat view: full transcript, like exiting ChatGPT's voice mode */
.chat-stage{flex:1;display:none;overflow:hidden;padding:0 20px}
.chat-log{height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.bubble-row{display:flex}
.bubble-row.you{justify-content:flex-end}
.chat-bubble{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;font-weight:600;line-height:1.35;border:2px solid var(--ink)}
.bubble-row.monty .chat-bubble{background:var(--leaf-t);border-bottom-left-radius:6px}
.bubble-row.you .chat-bubble{background:var(--surface);border-bottom-right-radius:6px}
.chat-empty{color:var(--muted);font-weight:600;font-size:14px;text-align:center;margin-top:20px}

/* Small dock mascot shown only in chat view, like a shrunken voice orb */
.mini-dock{display:none;align-items:center;justify-content:center;gap:16px;padding:6px 0 2px}
.monty-mini{width:56px;transition:opacity .3s}
.mic-btn-sm{width:40px;height:40px;margin-top:0}
#talk[data-mode="muted"] .monty-mini{opacity:.4}

#talk.chat .focus-stage{display:none}
#talk.chat .chat-stage{display:block}
#talk.chat .mini-dock{display:flex}

.talk-actions{margin-top:auto;padding:12px 20px 18px}
.text-toggle{display:flex;align-items:center;gap:8px;margin:0 auto 12px;background:none;border:0;font-family:var(--display);font-weight:600;color:var(--ink);cursor:pointer;font-size:16px;padding:6px 10px;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}

/* SUMMARY */
.chip{padding:5px 12px;border-radius:99px;font-size:13px;font-weight:700;background:var(--t);color:var(--ink);border:1.5px solid var(--ink)}
.sum-head{display:flex;align-items:center;gap:8px}
.sum-head img{width:104px;flex:none;animation:chat 1.3s ease-in-out 3}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 18px}
.t-grammar{--t:var(--coral-t);--c:var(--coral)}
.t-natural{--t:var(--sea-t);--c:var(--sea)}
.t-nice{--t:var(--sun-t);--c:var(--sun)}
.t-grammar .chip,.chip.t-grammar,.tag.t-grammar{background:var(--coral)}
.chip.t-natural,.tag.t-natural{background:var(--sea)}
.chip.t-nice,.tag.t-nice{background:var(--sun)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:700;color:var(--ink);border:1px solid var(--ink);align-self:flex-start}
.tag.plain{background:var(--shell-t)}
.insight{border-radius:16px;padding:16px 16px 18px;margin-bottom:16px}
.insight .said{margin-top:12px;font-size:16px;font-weight:600;color:var(--muted)}
.insight .said s,.first s,.convo li s,.win-hero-card .said s{text-decoration:none;background:var(--coral-t);color:var(--coral-x);padding:1px 6px;border-radius:6px;font-style:normal}
.insight .better{margin-top:8px;font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.005em;color:var(--ink);background:var(--ok-t);padding:6px 12px;border-radius:12px;border:1.5px solid var(--ink);display:inline-block}
.insight .why{margin-top:10px;font-size:14px;font-weight:600;color:var(--muted);line-height:1.4}
.insight.nice .better{margin-top:12px}
/* "You improved!" hero: a real win, shown before the to-improve list */
.win-hero{background:var(--ok-t);border:2px solid var(--ink);border-radius:24px;padding:16px;margin:18px 0 8px}
.win-hero .tag{background:var(--sun)}
.win-hero-sub{margin-top:4px;font-family:var(--hand);font-weight:600;font-size:19px;color:var(--ink)}
.win-hero-card{margin-top:12px;background:var(--surface);border:1px solid var(--ink);border-radius:16px;padding:12px 14px}
.win-hero-card .said{margin-top:0}
.win-hero-card .better{margin-top:6px}
.cta-bar{padding:12px 20px 18px}

/* CARDS */
.progress{flex:1;height:14px;border-radius:99px;background:#fff;overflow:hidden;border:2px solid var(--ink)}
.progress i{display:block;height:100%;background:var(--leaf);transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.count{font-family:var(--display);font-weight:600;font-size:16px;min-width:34px;text-align:right}
.flip{perspective:1200px;height:440px;margin-top:10px}
.flip-in{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.15,.4,1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:24px;border:2px solid var(--ink);padding:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.face.back{transform:rotateY(180deg)}
.face .lab{margin-top:20px;font-size:15px;font-weight:700;color:var(--muted)}
.quote{margin-top:6px;font-family:var(--display);font-size:30px;line-height:1.12;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.quote.right{color:var(--ok-x)}
.ask-row{margin-top:auto;display:flex;align-items:flex-end;gap:4px;margin-left:-8px;margin-bottom:-8px}
.ask-row img{width:96px;flex:none}
.ask-row .bubble{margin:0 0 20px;background:var(--sea-t);font-size:15px;padding:12px 14px;border:1px solid var(--ink)}
.ipa{margin-top:12px;background:var(--sea-t);color:var(--ink);border-radius:14px;padding:9px 14px;border:1px solid var(--ink)}
.ipa small{display:block;font-size:12px;font-weight:700;opacity:.7}
.ipa span{display:block;margin-top:2px;font-size:17px;font-weight:600;line-height:1.35;font-family:"Noto Sans","Segoe UI","Lucida Sans Unicode","DejaVu Sans",system-ui,sans-serif}
.first{margin-top:8px;font-size:13px;font-weight:600;color:var(--muted)}
.audio{margin-top:auto;display:flex;align-items:center;gap:10px;align-self:flex-start;border:2px solid var(--ink);background:var(--sea-t);color:var(--ink);font-family:var(--display);font-weight:600;padding:8px 16px;border-radius:99px;cursor:pointer;font-size:16px;transition:transform .08s,box-shadow .08s;box-shadow:2px 2px 0 var(--ink)}
.audio:active{transform:translate(2px,2px);box-shadow:none}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:2px solid var(--ink);border-radius:16px;padding:10px 2px 8px;color:var(--ink);background:var(--c);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-size:16px;transition:transform .08s,box-shadow .08s;box-shadow:2px 2px 0 var(--ink)}
.rate:active{transform:translate(2px,2px);box-shadow:none}
.rate small{font-family:var(--body);font-size:12px;font-weight:700}
.rate.again{--c:var(--coral-t)}.rate.hard{--c:var(--sun-t)}.rate.good{--c:var(--ok-t)}.rate.easy{--c:var(--sea-t)}
.rate-hint{text-align:center;margin-bottom:10px}

/* DONE */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 28px;gap:10px}
.done-monty{width:220px;animation:chat 1s ease-in-out 3}
.stats{display:flex;gap:10px;margin:14px 0 0;width:100%}
.stat{flex:1;border-radius:14px;padding:12px 8px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:700}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
.conf{position:absolute;top:-16px;width:10px;height:16px;border:2px solid var(--ink);border-radius:3px;animation:fall 2.6s ease-in forwards;z-index:50;pointer-events:none}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:.9}}

/* PRACTICE */
.pr-head{position:relative;flex:none;background:var(--p-talk);color:var(--on-dark);padding:16px 20px 18px;border-radius:0}
.pr-row{position:relative;display:flex;align-items:center;justify-content:space-between}
.pr-head h1{margin:0;font-size:26px;color:var(--on-dark)}
.pr-head p{margin-top:3px;font-weight:600;font-size:14px;max-width:85%;color:var(--on-dark);opacity:.9}
.pr-scroll{padding-top:0}
.pr-head{margin:0 -20px 22px;width:calc(100% + 40px)}
.due-card{position:relative;border-radius:24px;padding:20px;min-height:160px;overflow:hidden}
.due-card .monty{position:absolute;right:-6px;bottom:-10px;width:140px;animation:idle 3.4s ease-in-out infinite}
.due-body{position:relative;z-index:2;max-width:58%}
.due-num{font-family:var(--display);font-size:60px;font-weight:700;line-height:1;letter-spacing:-.03em}
.sec-row{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px}
.seg{display:flex;gap:3px;height:16px;border-radius:99px;overflow:hidden;border:2px solid var(--ink);background:#fff}
.seg i{display:block;height:100%}
.seg i+i{border-left:1.5px solid var(--ink)}
.seg-new{background:var(--new)}.seg-learning{background:var(--sea-soft)}.seg-mastered{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:14px;font-weight:600;color:var(--muted)}
.legend b{color:var(--ink);font-family:var(--display);font-weight:600}
.dotc{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;border:1.5px solid var(--ink)}
.status{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid var(--ink)}
.s-new{background:var(--new)}.s-learning{background:var(--sea-soft)}.s-mastered{background:var(--ok)}
.convo{border-radius:24px;margin-bottom:14px}
.convo summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.convo summary::-webkit-details-marker{display:none}
.convo summary b{font-family:var(--display);font-size:17px;font-weight:700;display:block;letter-spacing:-.005em}
.convo .chev{transition:transform .2s;color:var(--ink)}
.convo[open] .chev{transform:rotate(90deg)}
.sent-body{padding:0 16px 16px;border-top:1px solid var(--ink);padding-top:12px}
.count-pill{background:var(--shell-t);font-weight:700;font-size:13px;padding:3px 9px;border-radius:99px;border:1.5px solid var(--ink)}

/* Practice sections */
.practice-card{padding:18px 16px 16px}
.pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pc-num{font-family:var(--display);font-weight:600;font-size:44px;line-height:1;letter-spacing:-.02em;margin-top:10px}
.pc-num-of{font-size:22px;color:var(--muted)}
.pc-sub{font-family:var(--hand);font-weight:600;font-size:19px;color:var(--muted);margin-top:0}
.pc-monty{width:92px;flex:none;animation:idle 3.4s ease-in-out infinite}
.practice-cta{margin-top:22px}
.cap{margin-top:12px;line-height:1.4}
.focus-row+.focus-row{margin-top:16px;padding-top:16px;border-top:1.5px dashed var(--ink)}
.focus-name{font-family:var(--display);font-weight:600;font-size:18px;display:block;margin-bottom:2px}
.mini{display:flex;gap:3px;height:12px;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff;margin-top:10px}
.mini i{display:block;height:100%}
.pat-lede{margin:2px 0 14px;line-height:1.4}
.pass-steps{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 4px;padding:0 2px}
.pass-step{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.pass-step b{font-family:var(--display);font-weight:700;color:var(--ink)}
.pass-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.pass-dot.pass-initial{background:var(--new)}
.pass-dot.pass-progress{background:var(--sun)}
.pass-dot.pass-finished{background:var(--ok)}
.challenge-anchor{position:relative;margin:0 20px 4px}
.challenge-toggle{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--ink);border-radius:22px;box-shadow:var(--pop) var(--pop) 0 var(--ink);padding:14px 16px}
.challenge-toggle .chev{transition:transform .2s;color:var(--ink)}
.challenge-toggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
/* floats above the mascot instead of pushing it down */
.challenge-overlay{position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;max-height:60vh;overflow-y:auto}
.challenge-sheet{background:var(--surface);border:2px solid var(--ink);border-radius:22px;box-shadow:var(--pop-lg) var(--pop-lg) 0 var(--ink);padding:16px}
.honesty-note{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-family:var(--hand);font-size:17px;line-height:1.3;color:var(--ink)}
.honesty-note .win-badge{margin-top:3px}
.win-line{display:flex;align-items:center;gap:6px;margin-top:10px;font-weight:700;font-size:13px;color:var(--ok-x)}
.win-badge{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ok);color:#fff;border:1.5px solid var(--ink);display:grid;place-items:center}
.two{display:flex;gap:28px}
.big-n{font-family:var(--display);font-weight:600;font-size:34px;line-height:1;letter-spacing:-.01em}
.week-bars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:16px}
.wbar{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.wbar i{display:block;width:100%;border:1.5px solid var(--ink);border-radius:8px 8px 4px 4px;background:var(--leaf);min-height:6px}
.wbar i.zero{background:#fff;border-style:dashed}
.wbar span{font-size:12px;font-weight:700;color:var(--muted)}
.wbar.today span{color:var(--ink);font-weight:700}
/* quiet "see all" link */
.need-row{display:flex;align-items:center;gap:12px}
.need-row+.need-row{margin-top:12px}
.need-name{flex:0 0 122px;font-family:var(--display);font-weight:600;font-size:16px}
.need-bar{flex:1;height:14px;border:1.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.need-bar i{display:block;height:100%;background:var(--coral)}
.need-n{min-width:18px;text-align:right;font-family:var(--display);font-weight:600;font-size:17px}
.see-all{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:22px;padding:8px;background:none;border:0;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;cursor:pointer}
.see-all.quiet{margin-top:10px;font-size:13px;color:var(--muted);text-decoration:none;font-weight:700}
.see-all.quiet:active{opacity:.6}
.sent summary .small{display:block;margin-top:2px}

/* Filterable, paginated sentence list */
.fchip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip-row::-webkit-scrollbar{display:none}
.fchip{flex:none;border:2px solid var(--ink);border-radius:99px;padding:6px 13px;background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:transform .08s}
.fchip:active{transform:scale(.95)}
.fchip.active{background:var(--leaf);box-shadow:2px 2px 0 var(--ink)}
.album-hint{margin-top:20px;color:var(--muted);font-weight:600;font-size:14px;line-height:1.4;text-align:center}
.date-range{display:flex;align-items:flex-end;gap:10px;margin-top:12px}
.date-range label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.date-range input[type="date"]{font-family:var(--body);font-weight:700;font-size:14px;color:var(--ink);background:var(--surface);border:2px solid var(--ink);border-radius:12px;padding:7px 9px;width:100%}
.date-range .round{flex:none;width:38px;height:38px}
.pager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:18px}
.pager .round:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

/* One shared look for every "sentence card" in the app (Summary, Conversation
   detail, Practice's wins, Before-you-talk, the in-talk reminder, the library).
   Flashcards keep their own richer flip-card design — this is for everything else. */
function sentenceCard(c, opts={}){
  const { showIpa, footer, audio, es } = opts;
  return `
    <article class="insight t-${c.type}">
      ${tagHTML(c.type)}
      ${c.said ? `<p class="said">You said: <s>${c.said}</s></p>` : ''}
      <p class="better">${c.better}</p>
      ${es ? `<p class="small" style="margin-top:8px">${c.es}</p>` : ''}
      ${showIpa ? `<div class="ipa"><small>Pronunciation (US)</small><span>${c.ipa}</span></div>` : ''}
      ${footer ? footer : ''}
      ${audio ? `<button class="audio" style="margin-top:12px" data-a="say" data-id="${c.id}">${ICON.sound(20)} Listen</button>` : ''}
    </article>`;
}
function speak(text){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=.92; speechSynthesis.speak(u); }catch(e){}
}
function confetti(){

  const cols=['#3FD12B','#10B374','#FFC400','#FF4458','#1E9BEB'];
  for(let i=0;i<48;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'%'; d.style.background=cols[i%cols.length];
    d.style.animationDelay=(Math.random()*.8)+'s'; d.style.animationDuration=(2+Math.random()*1.6)+'s';

}

  },

  practice(){
    const n = state.due.length;
    const cnt = {new:0,learning:0,mastered:0};
    state.cards.forEach(c=>cnt[c.status]++);
    const areasAll = focusAreas();
    const areas = state.expandAreas ? areasAll : areasAll.slice(0,4);
    const masteredWins = state.cards.filter(c=>state.masteredToday.includes(c.id)).slice(0,3);
    const correctedWins = state.cards.filter(c=>c.win && !state.masteredToday.includes(c.id)).slice(0,3);
    return `
    <section class="screen p-practice enter">
      <div class="scroll pr-scroll">
        <header class="pr-head">
          <div class="pr-row"><h1>Practice</h1><span class="pill streak ${state.bumped?'pop':''}">${ICON.flame(18)}${state.streak}</span></div>
          <p>Your sentences, back right when you need them.</p>
        </header>

        <div class="card practice-card">
          <div class="pc-top">
            <div>
              <span class="tag plain">Your progress</span>
              <div class="pc-num">${cnt.mastered}<span class="pc-num-of"> / ${state.cards.length}</span></div>
              <p class="pc-sub">sentences mastered</p>
            </div>
            <img class="monty pc-monty" src="${n>0?ASK_MASCOT:MASCOT}" alt="">
          </div>
          <div class="seg" style="margin-top:16px" role="img" aria-label="${cnt.new} new, ${cnt.learning} learning, ${cnt.mastered} mastered">
            ${['new','learning','mastered'].map(k=>cnt[k]?`<i class="seg-${k}" style="flex:${cnt[k]}"></i>`:'').join('')}
          </div>
          <div class="legend">
            ${['new','learning','mastered'].map(k=>`<span><i class="dotc seg-${k}"></i>${STATUS[k]} <b>${cnt[k]}</b></span>`).join('')}
          </div>
          <p class="small cap">Sentences move from New to Learning to Mastered as you review them.</p>
        </div>

        <div class="practice-cta">
          ${n>0 ? `<button class="btn sea big" data-a="review">Review ${n} sentences</button>` : `<button class="btn sea big" data-a="reviewAgain">Practice again</button>`}
        </div>

        ${areasAll.length ? `
        <h2 class="sec">What you're improving</h2>
        <div class="card">
          ${areas.map(a=>`
          <div class="focus-row">
            <b class="focus-name">${a.cat}</b>
            <p class="small">${a.total} sentence${a.total>1?'s':''} · ${a.mastered} mastered · ${a.learning+a.new} learning</p>
            <div class="mini">
              ${a.mastered?`<i class="seg-mastered" style="flex:${a.mastered}"></i>`:''}${a.learning?`<i class="seg-learning" style="flex:${a.learning}"></i>`:''}${a.new?`<i class="seg-new" style="flex:${a.new}"></i>`:''}
            </div>
          </div>`).join('')}
        </div>
        ${areasAll.length>4 ? `<button class="see-all quiet" data-a="toggleAreas">${state.expandAreas?'Show less':`See all ${areasAll.length}`} ${ICON.chev(14)}</button>` : ''}` : ''}

        ${correctedWins.length ? `
        <h2 class="sec">Corrected in conversation</h2>
        <p class="sub pat-lede">Things you used to get wrong — and said the natural way while talking.</p>
        ${correctedWins.map(c=>sentenceCard(c, {footer:`<p class="win-line"><span class="win-badge">${ICON.check(11)}</span>${c.win}</p>`})).join('')}` : ''}

        ${masteredWins.length ? `
        <h2 class="sec">Mastered</h2>
        <p class="sub pat-lede">Flashcards you've studied enough to call done.</p>
        ${masteredWins.map(c=>sentenceCard(c, {footer:`<p class="win-line"><span class="win-badge">${ICON.check(11)}</span>Moved from Learning to Mastered</p>`})).join('')}` : ''}

        <button class="see-all" data-a="openLibrary">See all my sentences ${ICON.chev(16)}</button>
      </div>
    </section>`;
  },

  library(){
    const PAGE_SIZE = 6;
    const whenOf = c => {
      for(const cv of state.convos) if(cv.items.some(i=>i.id===c.id)) return cv;
      return null;
    };
    const statuses = state.libStatuses;
    let filtered = state.cards.filter(c => {
      if(!statuses[c.status]) return false;
      const cv = whenOf(c);
      const d = cv ? cv.date : null;
      if(state.libFrom && (!d || d < state.libFrom)) return false;
      if(state.libTo && (!d || d > state.libTo)) return false;
      return true;
    });
    filtered.sort((a,b)=>{
      const da = whenOf(a)?.date || '0000-00-00', db = whenOf(b)?.date || '0000-00-00';
      return db.localeCompare(da); // newest first
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length/PAGE_SIZE));
    const page = Math.min(Math.max(1, state.libPage||1), totalPages);
    const pageItems = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

    const statusChips = ['new','learning','mastered'].map(s=>
      `<button class="fchip ${statuses[s]?'active':''}" data-a="libStatus" data-v="${s}" aria-pressed="${!!statuses[s]}">${STATUS[s]}</button>`
    ).join('');

    const rows = pageItems.length ? pageItems.map(c=>{
      const cv = whenOf(c);
      return `
      <details class="convo sent">
        <summary>
          <span class="grow"><b>${c.better}</b><span class="small">${cv?cv.when:'Earlier'} · ${c.category}</span></span>
          <span class="status s-${c.status}">${STATUS[c.status]}</span>
          <span class="chev">${ICON.chev(18)}</span>
        </summary>
        <div class="sent-body">
          ${sentenceCard(c, {es:true, showIpa:true, footer:`<p class="why">${c.why}</p>`, audio:true})}
        </div>
      </details>`;
    }).join('') : `<p class="album-hint">No sentences match these filters yet.</p>`;

    const pager = `
      <div class="pager">
        <button class="round" data-a="libPage" data-v="${page-1}" ${page<=1?'disabled':''} aria-label="Previous page">${ICON.chev(18)}</button>
        <span class="small">Page ${page} of ${totalPages}</span>
        <button class="round" data-a="libPage" data-v="${page+1}" ${page>=totalPages?'disabled':''} aria-label="Next page" style="transform:scaleX(-1)">${ICON.chev(18)}</button>
      </div>`;

    return `
    <section class="screen p-practice enter">
      <div class="scroll">
        <header class="topbar">
          <button class="round" data-a="goPractice" aria-label="Back to Practice">${ICON.x(20)}</button>
          ${logo(30,19)}
          <span style="width:44px"></span>
        </header>
        <h1>All my sentences</h1>
        <p class="sub" style="margin-bottom:14px">${filtered.length} sentence${filtered.length===1?'':'s'} match your filters</p>
        <div class="fchip-row">${statusChips}</div>
        <div class="date-range">
          <label>From<input type="date" id="libFrom" value="${state.libFrom||''}" max="${TODAY_ISO}"></label>
          <label>To<input type="date" id="libTo" value="${state.libTo||''}" max="${TODAY_ISO}"></label>
          ${(state.libFrom||state.libTo) ? `<button class="round" data-a="libClearDates" aria-label="Clear dates">${ICON.x(16)}</button>` : ''}
        </div>
        <div style="height:16px"></div>
        ${rows}
        ${filtered.length>PAGE_SIZE ? pager : ''}
      </div>
    </section>`;
  }
};

/* ---------- Render ---------- */
function render(){
  view.innerHTML = screens[state.screen]();
  const showTabs = state.screen==='home' || state.screen==='practice';
  tabs.style.display = showTabs ? 'block' : 'none';
  phone.classList.toggle('with-tabs', showTabs);
  if(showTabs) updateTabs(state.screen==='home' ? 'home' : 'practice');
  state.bumped = false;
  if(state.screen==='talk') startTalk();
  if(state.screen==='done' || state.screen==='recap'){ confetti(); }
}

/* ---------- Bottom tab bar (built once so the indicator can slide) ---------- */
function buildTabs(){
  tabs.innerHTML = `
    <div class="tabs-track">
      <button class="tab" data-tab="home" data-a="goHome"><span class="ico">${ICON.home(26)}</span>Home</button>
      <button class="tab" data-tab="practice" data-a="goPractice"><span class="ico">${ICON.cards(26)}<span class="dot" id="dot"></span></span>Practice</button>
    </div>`;
}
function updateTabs(active){
  tabs.dataset.active = active;
  tabs.querySelectorAll('.tab').forEach(t=>{
    const on = t.dataset.tab===active;
    t.classList.toggle('active', on);
    if(on) t.setAttribute('aria-current','page'); else t.removeAttribute('aria-current');
  });
  const dot = $('#dot'); if(dot) dot.textContent = state.due.length || '';
}

/* ---------- Talk simulation ---------- */
const SCRIPT = [
  {m:'speaking', who:'monty', text:"Hi Ana! What have you been up to today?", d:3600},
  {m:'listening',who:'you', text:"Honestly, it's been busy. I go to the office yesterday and I'm going to the office tomorrow too.", d:5200},
  {m:'thinking', d:1500},
  {m:'speaking', who:'monty', text:"Sounds like a lot! Tell me more about that.", d:3800},
  {m:'listening',who:'you', text:"I would sleep in, walk on the beach with my dog. I have 25 years, so I want to enjoy it!", d:5200},
  {m:'thinking', d:1500},
  {m:'speaking', who:'monty', text:"I love that. Tell me more about the beach. What do you do there?", d:3800},
  {m:'listening',who:'you', text:"I've been meaning to try that new place near the pier.", d:4600},
  {m:'thinking', d:1400}
];
function paintTranscript(){
  const root = $('#talk'); if(!root) return;
  root.classList.toggle('chat', state.showText);
  const log = $('#chatLog'); if(!log) return;
  if(!state.lines.length){
    log.innerHTML = `<p class="chat-empty">Your conversation will appear here as you talk.</p>`;
  } else {
    log.innerHTML = state.lines.map(l=>`<div class="bubble-row ${l.who}"><div class="chat-bubble">${l.text}</div></div>`).join('');
    log.scrollTop = log.scrollHeight;
  }
}
// Current pose: stretch, then squash. New pose: starts squashed, then
// stretches back out. Four quick beats, chained one after another.
function poseStep(img, transform, ms, ease, next){
  img.style.transition = `transform ${ms}ms ${ease}`;
  requestAnimationFrame(()=>{ img.style.transform = transform; });
  let done = false;
  const fin = ()=>{ if(done) return; done = true; if(next) next(); };
  img.addEventListener('transitionend', fin, {once:true});
  setTimeout(fin, ms + 30); // fallback in case transitionend doesn't fire
}
function swapPose(img, newSrc){
  if(!img || img.src === newSrc || img.dataset.posing === '1') return;
  img.dataset.posing = '1';
  poseStep(img, 'scale(.95,1.06)', 90, 'ease-out', ()=>{        // current: stretch
    poseStep(img, 'scale(1.08,.93)', 90, 'ease-in', ()=>{        // current: squash
      img.src = newSrc;
      img.style.transition = 'none';
      img.style.transform = 'scale(1.08,.93)';                   // new pose starts squashed
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        poseStep(img, 'scale(1,1)', 140, 'cubic-bezier(.3,1.3,.6,1)', ()=>{ // new: stretch back
          img.dataset.posing = '0';
        });
      }));
    });
  });
}
function setMode(step){
  const root = $('#talk'); if(!root) return;
  const mode = step.m;
  root.dataset.mode = mode;
  const st = $('#status');
  if(st){
    if(mode==='speaking') st.textContent = 'Monty is speaking';
    if(mode==='listening') st.textContent = 'Your turn. Keep talking';
    if(mode==='thinking') st.textContent = 'Monty is thinking';
  }
  const pose = mode==='speaking' ? TALK_POSE : mode==='thinking' ? THINK_POSE : LISTEN_POSE;
  swapPose($('#montyBig'), pose); swapPose($('#montyMini'), pose);
  if(step.text) { state.lines.push({who:step.who,text:step.text}); paintTranscript(); }
}
let talkStepIndex = 0;
function talkStep(){
  if(state.paused) return;
  const st = SCRIPT[talkStepIndex % SCRIPT.length];
  setMode(st);
  timers.push(setTimeout(()=>{ talkStepIndex++; talkStep(); }, st.d));
}
function startTalk(){
  state.sec = 0; state.lines = []; state.paused = false;
  talkStepIndex = 0;
  paintTranscript();
  clock = setInterval(()=>{ if(!state.paused){ state.sec++; const t=$('#timer'); if(t) t.textContent = fmt(state.sec); } },1000);
  talkStep();
}

/* ---------- Review session ---------- */
function startReview(list){
  const queue = list.map(c=>({...c}));
  state.session = {queue, total:queue.length, done:0, mastered:0, learning:0, seen:new Set()};
  go('cards');
}
// Anki-style two-pass session: rate a card Easy the first time and it's done
// right away. Anything else sends it to the back of the queue for a second
// look later in this same session — once you've seen it twice, it settles
// as Learning no matter what you pick that second time.
function rate(g){
  const s = state.session, c = s.queue.shift();
  const secondPass = s.seen.has(c.id);
  const finalize = secondPass || g==='easy';

  if(!finalize){
    // First time through, and not Easy — goes to the back for a second look.
    s.seen.add(c.id);
    s.queue.push(c);
  } else {
    s.done++; state.reviewedToday++; state.due = state.due.filter(d=>d.id!==c.id);
    const status = (g==='easy' && !secondPass) ? 'mastered' : 'learning';
    if(status==='mastered'){ s.mastered++; if(!state.masteredToday.includes(c.id)) state.masteredToday.push(c.id); } else { s.learning++; }
    const m = state.cards.find(x=>x.id===c.id); if(m){ m.due=false; m.status = status; }
  }
  if(!s.queue.length){ go('done'); }
  else { if(window.speechSynthesis) try{speechSynthesis.cancel()}catch(e){} state.screen='cards'; render(); }
}

/* ---------- Events ---------- */
phone.addEventListener('change', e=>{
  if(e.target.id==='libFrom'){ state.libFrom = e.target.value; state.libPage=1; render(); }
  if(e.target.id==='libTo'){ state.libTo = e.target.value; state.libPage=1; render(); }
});
phone.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a;
  switch(a){
    case 'start': go(challengeCards().length ? 'preTalk' : 'talk'); break;
    case 'beginTalk': go('talk'); break;
    case 'review': startReview(state.due); break;
    case 'reviewAgain': startReview(state.cards); break;
    case 'goHome': case 'goTalk': go('home'); break;
    case 'goPractice': go('practice'); break;
    case 'home': go('home'); break;
    case 'end': go('recap'); break;
    case 'viewSummary': go('summary'); break;
    case 'skipSummary': go('home'); break;
    case 'toggleChallenge': {
      const overlay = $('#challengeOverlay'), btn = $('#challengeToggle');
      const show = overlay.hasAttribute('hidden');
      if(show) overlay.removeAttribute('hidden'); else overlay.setAttribute('hidden','');
      btn.setAttribute('aria-expanded', String(show));
      break;
    }
    case 'endTurn': {
      // Tapped "done talking" — cut the scripted listening timer short and
      // move straight to the thinking step, same as releasing a real mic.
      const root = $('#talk');
      if(!root || root.dataset.mode !== 'listening' || state.paused) break;
      timers.forEach(clearTimeout); timers = [];
      talkStepIndex++;
      talkStep();
      break;
    }
    case 'pauseTalk':
      state.paused = !state.paused;
      el.classList.toggle('on', state.paused);
      el.setAttribute('aria-pressed', String(state.paused));
      el.setAttribute('aria-label', state.paused ? 'Resume conversation' : 'Pause conversation');
      el.innerHTML = state.paused ? ICON.play(22) : ICON.pause(22);
      if(state.paused){
        timers.forEach(clearTimeout); timers = [];
        const root=$('#talk'); if(root) root.dataset.mode = 'muted'; // reuse the dim, frozen look
        const st=$('#status'); if(st) st.textContent = 'Paused';
      } else {
        talkStep();
      }
      break;
    case 'text':
      state.showText = !state.showText;
      el.innerHTML = (state.showText ? ICON.eyeOff(20)+' Hide text' : ICON.eye(20)+' Show text');
      paintTranscript(); break;
    case 'addPractice':
      if(!state.added){
        state.added = true;
        state.due = [...NEW.map(c=>({...c})), ...state.due];
        state.streak++; state.bumped = true;
        state.week[state.today] = true; state.minToday += 6; state.weekMinutes[state.today] += 6; state.weekConvos++;
        NEW.forEach(c=>state.cards.push({...c,status:'new',due:true}));
        // The AI never touches a flashcard's schedule — only the Again/Hard/Good/Easy
        // rating system does that. A conversation can only flag that a pending card was
        // used correctly; the card stays in Learning until you actually review it.
        const suggested = challengeCards();
        suggested.forEach(c=>{ c.win='You used this correctly in your latest conversation'; });
        const bonus = state.cards.find(c=>c.status==='learning' && !c.win && !suggested.includes(c));
        if(bonus){ bonus.win = "You used this correctly too — it wasn't even on today's list!"; }
        state.convos.unshift({title:'Free talk', when:"Today", date:TODAY_ISO, min:6, items:NEW}); state.limit = true;
      }
      startReview(state.due); break;
    case 'openConvo': state.viewIdx=+el.dataset.i; go('convo'); break;
    case 'say': { const c=state.cards.find(x=>x.id===el.dataset.id); if(c) speak(c.better); } break;
    case 'openLibrary': state.libStatuses={new:true,learning:true,mastered:true}; state.libFrom=''; state.libTo=''; state.libPage=1; go('library'); break;
    case 'libStatus': state.libStatuses[el.dataset.v] = !state.libStatuses[el.dataset.v]; state.libPage=1; render(); break;
    case 'libPage': state.libPage=+el.dataset.v; render(); break;
    case 'libClearDates': state.libFrom=''; state.libTo=''; state.libPage=1; render(); break;
    case 'toggleAreas': state.expandAreas=!state.expandAreas; render(); break;
    case 'exitCards': go('home'); break;
    case 'reveal': {
      $('#flip').classList.add('flipped');
      const secondPass = state.session.seen.has(state.session.queue[0].id);
      $('#actions').innerHTML = `
        <p class="small rate-hint">${secondPass ? 'Second look — this one settles now, however you rate it.' : 'How well did you remember it?'}</p>
        <div class="rates">
          ${['again','hard','good','easy'].map(g=>`<button class="rate ${g}" data-a="rate" data-g="${g}">${g[0].toUpperCase()+g.slice(1)}<small>${INTERVALS[g]}</small></button>`).join('')}
        </div>`;
      break;
    }
    case 'rate': rate(el.dataset.g); break;
    case 'audio': speak(state.session.queue[0].better); break;
  }
});

buildTabs();
render();
</script>
</body>
</html>
